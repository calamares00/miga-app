name: CodeQL

# Security analysis of the app's code (Kotlin and Java) by GitHub's CodeQL. Results appear under
# Security > Code scanning, and on pull requests as checks. Runs apart from the build, so it does
# not slow it down, and once a week to catch new queries.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: java-kotlin
          build-mode: manual

      # CodeQL reads the code while the compiler runs, so nothing may come from the build cache.
      - name: Compile
        run: |
          chmod +x gradlew
          # The Kotlin compiler runs inside Gradle, where CodeQL's extractor can see it, with more
          # memory than a normal build: the default 2 GB ran out with the extractor attached.
          ./gradlew --no-build-cache --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:compileFdroidDebugKotlin :app:compilePlayDebugKotlin --stacktrace

      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:java-kotlin"

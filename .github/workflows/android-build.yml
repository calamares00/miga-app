name: Android CI (Miga)

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

# A newer push to the same branch or pull request makes the older run pointless; on main a run is
# never cancelled, so a release in progress always finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # What changed decides what runs:
  # - the app (code, resources, Gradle): tests, build and, on a branch, the beta APK;
  # - only the workflows: tests, to see they still work, and nothing is built or published;
  # - only docs or the store listing (*.md, docs/, fastlane/metadata/): nothing.
  # On main, a Release and the Google Play upload happen only for a new version: versionCode up
  # from the previous commit and no tag v<versionName> yet. A pull request that changes the app
  # without raising the version or without its release notes fails here, before it is merged.
  # A pull request run stops after this job: the push of the same commit to its branch already
  # runs the tests and the build (and its checks show on the pull request), so they are not
  # repeated.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.classify.outputs.app }}
      workflow: ${{ steps.classify.outputs.workflow }}
      release: ${{ steps.classify.outputs.release }}
      production: ${{ steps.classify.outputs.production }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the changes
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          code_of() { git show "$1:app/build.gradle.kts" 2>/dev/null | grep -oP 'versionCode = \K[0-9]+' || echo 0; }
          # What this run is compared with: the pull request's base, the commit before the push,
          # or (a new branch) where it left main. A manual run checks everything.
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          elif [ "$EVENT" = "push" ]; then
            base=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
          fi
          if [ -z "$base" ]; then
            files=$(git ls-files)
          else
            files=$(git diff --name-only "$base" HEAD)
          fi
          echo "Changed files:"; echo "$files" | sed 's/^/  /'

          app=false; workflow=false
          if echo "$files" | grep -qE '^(app/|gradle/|build\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$|gradlew)'; then app=true; fi
          if echo "$files" | grep -qE '^\.github/'; then workflow=true; fi

          now=$(code_of HEAD)
          before=$(code_of "${base:-HEAD}")
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)

          release=false
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            if [ "$now" -gt "$before" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
              release=true
            elif [ "$app" = "true" ]; then
              echo "::warning::The app changed on main without a new version ($version, code $now): nothing is published."
            fi
          fi

          # Caught on the pull request, not after merging: an app change needs a new version and
          # its release notes in the four places.
          if [ "$EVENT" = "pull_request" ] && [ "$app" = "true" ]; then
            if [ "$now" -le "$before" ]; then
              echo "::error::The app changes but versionCode is still $now: raise versionCode and versionName (see CLAUDE.md)."
              exit 1
            fi
            for dir in app/src/main/assets/changelogs app/src/main/assets/changelogs-en fastlane/metadata/android/es-ES/changelogs fastlane/metadata/android/en-US/changelogs; do
              if [ ! -f "$dir/$now.txt" ]; then
                echo "::error::Missing release notes $dir/$now.txt."
                exit 1
              fi
            done
          fi

          # A new version whose pull request is labelled env/pro also goes to production (to the
          # public) right after the closed beta; without the label it stays in the beta until it
          # is released with the "Publicar en producción" workflow.
          production=false
          if [ "$release" = "true" ]; then
            labels=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].labels[].name' 2>/dev/null || true)
            if echo "$labels" | grep -qx 'env/pro'; then production=true; fi
          fi

          echo "app=$app workflow=$workflow release=$release production=$production (versionCode $before -> $now, v$version)"
          { echo "app=$app"; echo "workflow=$workflow"; echo "release=$release"; echo "production=$production"; } >> "$GITHUB_OUTPUT"
          {
            echo "### What this run does"
            echo "- App changed: **$app** · workflows changed: **$workflow**"
            echo "- New version to publish: **$release** (versionCode $before → $now, v$version)"
            if [ "$release" = "true" ]; then
              if [ "$production" = "true" ]; then echo "- Destination: closed beta **and production** (label env/pro)"
              else echo "- Destination: closed beta (release it to the public with «Publicar en producción»)"; fi
            fi
            if [ "$EVENT" = "pull_request" ]; then echo "- Pull request: version and release notes checked; tests and build run on the push of this commit."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs when the app or the workflows changed (see changes); a broken test blocks the rest just
  # like a compile error.
  test:
    name: Tests
    needs: changes
    if: github.event_name != 'pull_request' && (needs.changes.outputs.app == 'true' || needs.changes.outputs.workflow == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Robolectric downloads Android itself (android-all, ~100 MB) from Maven Central on the
      # first test; when that download fails every Robolectric test fails with it. Kept between
      # runs, keyed on the dependencies, so it is downloaded once.
      - name: Cache Robolectric's Android
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts') }}
          restore-keys: robolectric-

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Every database version needs its Room schema (app/schemas) committed, or migrations to
      # later versions cannot be tested. The build exports it; a new or changed one fails here and
      # is printed so it can be committed.
      - name: Room schemas committed
        if: always()
        run: |
          changed=$(git status --porcelain --untracked-files=all app/schemas | cut -c4-)
          if [ -n "$changed" ]; then
            echo "::error::Room schema not committed: $changed"
            # Compressed and with a checksum, so it can be copied from this log exactly.
            for f in $changed; do
              echo "===== $f sha256=$(sha256sum "$f" | cut -d' ' -f1)"
              gzip -9c "$f" | base64 -w0; echo
            done
            exit 1
          fi

      # Artifact name unique per branch and commit. It does not depend on the mode (that belongs to
      # build/publish); it only needs to identify the run in a readable way.
      - name: Compute artifact name suffix
        id: ref
        if: always()
        run: |
          echo "safe_ref=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: miga-unit-test-report-${{ steps.ref.outputs.safe_ref }}-${{ steps.ref.outputs.short_sha }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

  # Compiles (and, depending on the branch, packages) the app. The mode decides what is built:
  # release: direct push to main (usually after merging a PR) -> full signed build.
  # check: push to main without a new version -> checks only (compile), nothing to publish.
  # dev_debug: push to any other branch, or a manual run -> a quick debug APK only.
  # Files ready to publish are left in dist/ and uploaded as an artifact so the publish job
  # (which runs on another runner) can download them without rebuilding.
  build:
    name: Build
    needs: [changes, test]
    # Only when the app changed (or there is a version to publish); not on pull requests (see changes).
    if: github.event_name != 'pull_request' && (needs.changes.outputs.app == 'true' || needs.changes.outputs.release == 'true')
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
      safe_ref: ${{ steps.mode.outputs.safe_ref }}
      short_sha: ${{ steps.mode.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # release: direct push to main (usually after merging a PR) -> full build + Release.
      # check: push to main without a new version -> checks only (compile), nothing is published.
      # dev_debug: push to any other branch, or a manual run -> a quick debug APK only.
      - name: Determine build mode
        id: mode
        run: |
          if [ "${{ needs.changes.outputs.release }}" = "true" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # On main without a new version the app is only checked: the existing Release and
            # Google Play are left alone.
            echo "mode=check" >> "$GITHUB_OUTPUT"
          else
            echo "mode=dev_debug" >> "$GITHUB_OUTPUT"
          fi
          # GitHub Actions artifact names do not allow "/", which is valid in a branch name
          # (e.g. "setup/initial-import"), so it is replaced with "-".
          echo "safe_ref=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # On any branch that will not run a real release build (which already compiles with
      # isMinifyEnabled=true below), check here that assembleRelease still compiles with R8, so a
      # broken ProGuard rule is caught on that branch and not only after merging.
      # The output is unsigned (no keystore secrets in this step) and is not published.
      - name: Build release APK (check R8 minification)
        if: steps.mode.outputs.mode != 'release'
        run: ./gradlew :app:assembleRelease --stacktrace

      # The AAB for Play is otherwise only built on main, so a change that breaks it was only seen
      # after merging (it happened with the ABI splits). Unsigned and not published.
      - name: Build release AAB (check the Play bundle)
        if: steps.mode.outputs.mode != 'release'
        run: ./gradlew :app:bundleRelease --stacktrace

      # On every branch: a lint error is cheaper to fix where it appears.
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      # --- main without a new version: check compilation ---

      - name: Build debug APK (check)
        if: steps.mode.outputs.mode == 'check'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK (check)
        if: steps.mode.outputs.mode == 'check'
        uses: actions/upload-artifact@v7
        with:
          name: miga-debug-${{ steps.mode.outputs.safe_ref }}-${{ steps.mode.outputs.short_sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # --- push to a branch other than main (or a manual run): debug APK only ---
      - name: Build debug APK (rama de desarrollo)
        if: steps.mode.outputs.mode == 'dev_debug'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK (rama de desarrollo)
        if: steps.mode.outputs.mode == 'dev_debug'
        uses: actions/upload-artifact@v7
        with:
          name: miga-debug-${{ steps.mode.outputs.safe_ref }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Also puts a renamed copy in dist/ (same naming as the beta Release in the publish job) and
      # uploads it as its own artifact, so publish does not have to rebuild anything.
      - name: Normalize debug APK names (canal beta)
        if: steps.mode.outputs.mode == 'dev_debug'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for f in app/build/outputs/apk/debug/*.apk; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            abi="${base#app-}"
            abi="${abi%-debug.apk}"
            cp "$f" "dist/miga-v${VERSION}-${abi}-debug.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "Ficheros generados:"
          ls -la dist

      - name: Upload beta dist (para el job publish)
        if: steps.mode.outputs.mode == 'dev_debug'
        uses: actions/upload-artifact@v7
        with:
          name: miga-beta-dist-${{ steps.mode.outputs.safe_ref }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # --- push to main: full build (debug + release per ABI + AAB) ---
      # The release keystore never lives in the repository (unlike debug.keystore): it is read from
      # 4 GitHub Actions secrets. Until they exist the release build is unsigned without breaking CI,
      # and the publish job marks the resulting Release as a pre-release.
      - name: Decode release keystore
        if: steps.mode.outputs.mode == 'release'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build debug + release APKs (por ABI + universal)
        if: steps.mode.outputs.mode == 'release'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Build release AAB (Play Store)
        if: steps.mode.outputs.mode == 'release'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Normalize output file names
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SLUG="miga"
          mkdir -p dist

          rename_apks() {
            local dir="app/build/outputs/apk/$1"
            [ -d "$dir" ] || return 0
            for f in "$dir"/*.apk; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              mid="${base#app-}"
              mid="${mid%.apk}"
              suffix=""
              if [[ "$mid" == *-unsigned ]]; then
                mid="${mid%-unsigned}"
                suffix="-unsigned"
              fi
              abi="${mid%-*}"
              build_type="${mid##*-}"
              cp "$f" "dist/${SLUG}-v${VERSION}-${abi}-${build_type}${suffix}.apk"
            done
          }

          rename_apks debug
          rename_apks release

          # Unlike APKs, Gradle does not add "-unsigned" to the AAB name when there is no
          # signingConfig, so whether it is signed is decided by the release keystore being present
          # (RELEASE_KEYSTORE_PATH, inherited from the previous step), not by the file name.
          aab_suffix=""
          if [ -z "${RELEASE_KEYSTORE_PATH:-}" ]; then
            aab_suffix="-unsigned"
          fi
          aab_dir="app/build/outputs/bundle/release"
          if [ -d "$aab_dir" ]; then
            for f in "$aab_dir"/*.aab; do
              [ -e "$f" ] || continue
              cp "$f" "dist/${SLUG}-v${VERSION}-release${aab_suffix}.aab"
            done
          fi

          # Checksums of everything published, so a download can be checked with
          # `sha256sum -c SHA256SUMS.txt --ignore-missing`.
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)

          echo "Ficheros generados:"
          ls -la dist

      - name: Upload build artifacts
        if: steps.mode.outputs.mode == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: miga-builds-v${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # What the Google Play upload in publish needs besides the AAB, kept out of the GitHub
      # Release: the R8 mapping (so Play shows readable stack traces for crashes and ANRs) and the
      # release notes, one whatsnew-<locale> file per language taken from the fastlane changelog
      # of this versionCode (Play allows 500 characters).
      - name: Prepare Google Play extras
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          mkdir -p play/whatsnew
          cp app/build/outputs/mapping/release/mapping.txt play/mapping.txt
          for dir in fastlane/metadata/android/*/; do
            locale=$(basename "$dir")
            notes="$dir/changelogs/$CODE.txt"
            [ -f "$notes" ] && cp "$notes" "play/whatsnew/whatsnew-$locale"
          done
          ls -la play play/whatsnew

      - name: Upload Google Play extras
        if: steps.mode.outputs.mode == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: miga-play-v${{ steps.version.outputs.version }}
          path: play/
          if-no-files-found: error
          retention-days: 30

  # Nothing to publish on main without a new version (mode == check): the whole job is skipped and shows
  # as "skipped" in the checks instead of an empty success. It downloads the dist/ prepared by
  # the build job (nothing is rebuilt) and uploads it to a GitHub Release.
  publish:
    name: Publish
    needs: [changes, build]
    if: needs.build.outputs.mode != 'check'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Publishes run one at a time: two pushes in a row used to publish at the same moment and the
    # older build could end up overwriting the newer one.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Besides this run's own artifact (uploaded by build), a single "beta-latest" Release is
      # published or updated (to test development builds by installing the APK by hand) with the
      # latest debug APK from any development branch. The tag is fixed on purpose: every push
      # overwrites it, so releases do not pile up.
      # A run whose commit is no longer the branch head must not replace a newer build.
      - name: Check this is the latest commit of the branch
        id: latest
        if: needs.build.outputs.mode == 'dev_debug'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha || echo "")
          if [ -z "$head" ] || [ "$head" = "${{ github.sha }}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "The branch already points to $head; beta-latest is left as it is."
          fi

      - name: Download beta dist
        if: needs.build.outputs.mode == 'dev_debug' && steps.latest.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: miga-beta-dist-${{ needs.build.outputs.safe_ref }}
          path: dist

      - name: Publish beta-latest Release
        if: needs.build.outputs.mode == 'dev_debug' && steps.latest.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: beta-latest
          name: "Miga v${{ needs.build.outputs.version }} (beta · ${{ github.ref_name }} · ${{ needs.build.outputs.short_sha }})"
          body: |
            Build de desarrollo automático, generado desde la rama `${{ github.ref_name }}`
            (commit ${{ github.sha }}). No es una versión estable: se sobrescribe en cada push
            a una rama que no es `main`.
          prerelease: true
          make_latest: false
          files: dist/*

      # Keeps beta-latest down to the APKs just published: any other file (older version names)
      # is deleted, so the release does not pile up old builds.
      - name: Remove old files from beta-latest
        if: needs.build.outputs.mode == 'dev_debug' && steps.latest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          release_id=$(gh api "repos/$repo/releases/tags/beta-latest" --jq .id)
          # The full list is read before deleting anything: deleting while paging shifts the pages
          # and skips files.
          assets=$(gh api --paginate "repos/$repo/releases/$release_id/assets?per_page=100" --jq '.[] | "\(.id) \(.name)"')
          echo "$assets" | while read -r id name; do
            if [ -n "$id" ] && [ ! -f "dist/$name" ]; then
              gh api -X DELETE "repos/$repo/releases/assets/$id" && echo "Deleted $name"
            fi
          done

      # --- push to main: stable GitHub Release with everything build left in dist/ ---
      - name: Download release dist
        if: needs.build.outputs.mode == 'release'
        uses: actions/download-artifact@v8
        with:
          name: miga-builds-v${{ needs.build.outputs.version }}
          path: dist

      # A version in the closed beta is a prerelease on GitHub, so the app's update notice
      # (AppUpdateClient reads the latest stable Release) only shows public versions. It becomes
      # the latest Release when it reaches production.
      - name: Create GitHub Release
        if: needs.build.outputs.mode == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Miga v${{ needs.build.outputs.version }}
          prerelease: ${{ secrets.RELEASE_KEYSTORE_BASE64 == '' || needs.changes.outputs.production != 'true' }}
          make_latest: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && needs.changes.outputs.production == 'true' }}
          files: dist/*

      # Google Play: the signed AAB goes to the track in the PLAY_TRACK repository variable
      # (internal testing when it is not set; "alpha" is closed testing, "production" production).
      # Needs the PLAY_SERVICE_ACCOUNT_JSON secret (a Google Cloud service account with release
      # rights in Play Console, see docs/google-play.md) and the release keystore; without either
      # the step is skipped and the Release on GitHub is all that is published.
      - name: Check Google Play upload
        id: play
        if: needs.build.outputs.mode == 'release'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] && [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "No PLAY_SERVICE_ACCOUNT_JSON or release keystore: not uploading to Google Play."
          fi

      - name: Download Google Play extras
        if: steps.play.outputs.upload == 'true'
        uses: actions/download-artifact@v8
        with:
          name: miga-play-v${{ needs.build.outputs.version }}
          path: play

      - name: Upload to Google Play
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.calamares.miga
          releaseFiles: dist/miga-v${{ needs.build.outputs.version }}-release.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
          whatsNewDirectory: play/whatsnew
          mappingFile: play/mapping.txt

      # Label env/pro: the version just uploaded to the beta goes on to production, the same AAB
      # (as the "Publicar en producción" workflow does by hand).
      - name: Checkout (env/pro)
        if: steps.play.outputs.upload == 'true' && needs.changes.outputs.production == 'true'
        uses: actions/checkout@v7

      - name: Release to production (env/pro)
        if: steps.play.outputs.upload == 'true' && needs.changes.outputs.production == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          pip install --quiet google-auth requests
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          python3 .github/scripts/play_promote.py --package org.calamares.miga \
            --from-track "${{ vars.PLAY_TRACK || 'internal' }}" --version-code "$code" --rollout 100
          echo "### Publicada en producción (env/pro): versionCode $code" >> "$GITHUB_STEP_SUMMARY"
